name: Build macOS App

on:
  workflow_dispatch:          # Allows you to run it manually
  push:
    tags:
      - 'v*'                  # Also runs when you create a version tag

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter tkcalendar matplotlib python-dateutil pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --windowed \
                      --name "BudgetTrackerMAC" \
                      --osx-bundle-identifier com.hashrate21.budgettracker \
                      --icon=BudgetAppIcon.icns \
                      Budget_Tracker.py

      - name: Zip the .app
        run: |
          cd dist
          zip -r PersonalBudgetTracker-macOS.zip PersonalBudgetTracker.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalBudgetTracker-macOS
          path: dist/PersonalBudgetTracker-macOS.zip
