name: Build macOS App

on:
  workflow_dispatch:          # Allows you to run it manually
  push:
    tags:
      - 'v*'                  # Also runs automatically when you push a tag like v0.90

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build the .app
        run: |
          pyinstaller --noconfirm --windowed --name "PersonalBudgetTracker" \
            --icon=BudgetAppIcon.icns \
            --add-data "$(python -c 'import customtkinter; print(customtkinter.__path__[0])'):customtkinter" \
            Budget_Tracker.py

      - name: Zip the .app (important!)
        run: |
          cd dist
          zip -r PersonalBudgetTracker-macOS.zip PersonalBudgetTracker.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalBudgetTracker-macOS
          path: dist/PersonalBudgetTracker-macOS.zip
